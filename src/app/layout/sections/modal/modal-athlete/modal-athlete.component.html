@if (isOpen()) {
  <div @backdropFade class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
       (click)="miscService.onBackdropClick($event, this.close.bind(this))">
    <div @modalSlideIn class="bg-neutral-100 rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto"
         (click)="$event.stopPropagation()">

      <!-- Header of Modal -->
      <div class="sticky top-0 bg-neutral-100 border-b border-neutral-200 px-6 py-4 flex items-center justify-between">
        <h3 class="text-4xl text-center lg:text-start tracking-wide font-normal text-gray-900">
          {{ isEditMode() ? 'Athlet bearbeiten' : 'Athlet hinzufügen' }}
        </h3>
        <button (click)="close()" type="button" class="cursor-pointer hover:bg-neutral-200 p-2 rounded-full">
          <img ngSrc="/assets/images/icons/cross-close.svg" alt="Close Icon" height="16" width="16" class="w-4 h-4 opacity-50" />
        </button>
      </div>

      <!-- Content -->
      <div class="px-6 py-4">
        <form (ngSubmit)="onSubmit()" class="space-y-4">

          <!-- First Row (Name + Country) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label for="athlete-name" class="block text-sm font-medium text-gray-700 mb-1">
                Wie heißt der Athlet? <span class="text-red-500">*</span>
              </label>
              <input [ngModel]="formData().name"  [maxLength]="25" name="name" id="athlete-name" type="text" required
                     (ngModelChange)="miscService.updateField(this.formData, 'name', $event)"
                     placeholder="Yanic, Nils, .."
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg placeholder-neutral-400">
            </div>
            <div>
              <label for="athlete-country-name" class="block text-sm font-medium text-gray-700 mb-1">
                Herkunftsland wählen.. <span class="text-red-500">*</span>
              </label>
              <select [ngModel]="formData().countryName" (ngModelChange)="onCountryChange($event)"
                      name="countryName" id="athlete-country-name" required
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                <option value="" disabled>Land auswählen</option>
                @for (country of countries(); track country) {
                  <option [value]="country">{{ country }}</option>
                }
              </select>
            </div>
          </div>

          <!-- Second Row (Sport discipline & best time) -->
          <div class="grid-cols-1 md:grid-cols-2 gap-4"
               [ngClass]="this.miscService.isRaceSport(formData().sport) ? 'grid' : ''">
            <div>
              <label for="athlete-sport" class="block text-sm font-medium text-gray-700 mb-1">
                Sportart wählen.. <span class="text-red-500">*</span>
              </label>
              <select [ngModel]="formData().sport" name="sport" id="athlete-sport" required
                      (ngModelChange)="miscService.updateField(this.formData, 'sport', $event)"
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                <option value="" disabled>Sportart auswählen</option>
                @for (sport of sports(); track sport) {
                  <option [value]="sport">{{ sport }}</option>
                }
              </select>
            </div>

            @if (this.miscService.isRaceSport(formData().sport)) {
              <div>
                <label for="best-time" class="block text-sm font-medium text-gray-700 mb-1">
                  Bestzeit <span class="text-red-500">*</span>
                </label>
                <input [ngModel]="formData().bestTime" (ngModelChange)="onBestTimeChange($event)"
                       name="bestTime" id="best-time" type="text" placeholder="z.B. 3:24.56"
                       [class.border-red-500]="bestTimeError()"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg placeholder-neutral-400">

                @if (bestTimeError()) {
                  <p class="mt-1 text-sm text-red-600">{{ bestTimeError() }}</p>
                }
              </div>
            }
          </div>

          <!-- Third Row (Medal Counts) -->
          <div class="grid grid-cols-3 gap-4">
            <div>
              <label for="gold" class="block text-sm font-medium text-gray-700 mb-1">🥇 Gold</label>
              <input [ngModel]="formData().goldMedals" name="gold" id="gold" type="number" min="0" required
                     (ngModelChange)="miscService.updateField(this.formData, 'goldMedals', +$event)"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            <div>
              <label for="silver" class="block text-sm font-medium text-gray-700 mb-1">🥈 Silber</label>
              <input [ngModel]="formData().silverMedals" name="silver" id="silver" type="number" min="0" required
                     (ngModelChange)="miscService.updateField(this.formData, 'silverMedals', +$event)"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            <div>
              <label for="bronze" class="block text-sm font-medium text-gray-700 mb-1">🥉 Bronze</label>
              <input [ngModel]="formData().bronzeMedals" name="bronze" id="bronze" type="number" min="0" required
                     (ngModelChange)="miscService.updateField(this.formData, 'bronzeMedals', +$event)"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="border-t border-neutral-200 w-full">
            <div class="flex flex-col-reverse sm:flex-row gap-3 pt-4 justify-center">
              <button type="button" (click)="close()"
                      class="w-full sm:w-auto px-6 py-2 border border-gray-300 rounded-lg text-gray-700
                           hover:bg-gray-200 transition-colors cursor-pointer">
                Abbrechen
              </button>
              <button type="submit" [disabled]="!isFormValid()" [class.opacity-50]="!isFormValid()"
                      [class.!cursor-not-allowed]="!isFormValid()"
                      class="w-full sm:w-auto px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600
                             disabled:bg-black transition-all font-semibold cursor-pointer">
                {{ isEditMode() ? 'Änderungen speichern' : 'Athlet hinzufügen' }}
              </button>
            </div>
          </div>

        </form>
      </div>

    </div>
  </div>
}
