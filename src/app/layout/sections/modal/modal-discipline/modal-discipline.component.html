@if (isOpen()) {
  <div @backdropFade class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
       (click)="miscService.onBackdropClick($event, this.close.bind(this))">
    <div @modalSlideIn class="bg-neutral-100 rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto"
         (click)="$event.stopPropagation()">

      <!-- Header -->
      <div class="sticky top-0 bg-neutral-100 border-b border-neutral-200 px-6 py-4 flex items-center justify-between">
        <h3 class="text-4xl tracking-wide font-normal text-gray-900">
          {{ 'MODAL.DISCIPLINES.ADD.TITLE' | translate }}
        </h3>
        <button (click)="close()" type="button" class="cursor-pointer hover:bg-neutral-200 p-2 rounded-full">
          <img ngSrc="/assets/images/icons/cross-close.svg" alt="Close Icon" height="16" width="16"
               class="w-4 h-4 opacity-50" />
        </button>
      </div>

      <!-- Form body -->
      <div class="px-6 py-4">
        <form (ngSubmit)="onSubmit()" class="space-y-4">

          <!-- First Row (Athlete Dropdown) -->
          <div>
            <label for="discipline-athlete" class="block text-sm font-medium text-gray-700 mb-1">
              {{ 'MODAL.DISCIPLINES.ATHLETE' | translate }} <span class="text-red-500">*</span>
            </label>

            <div class="flex gap-2">
              <div class="relative flex-1 min-w-0">
                <select [ngModel]="formData().athleteId" (ngModelChange)="onAthleteChange($event)"
                        name="athleteId" id="discipline-athlete" required
                        class="w-full appearance-none px-4 py-2 pr-8 border border-gray-300 rounded-lg cursor-pointer bg-white">
                  <option [value]="0" disabled>{{ 'MODAL.DISCIPLINES.ATHLETE.PLACEHOLDER' | translate }}</option>
                  @for (athlete of sortedAthletes(); track athlete.id) {
                    <option [value]="athlete.id">{{ athlete.firstName }} {{ athlete.lastName }}</option>
                  }
                </select>
                <img ngSrc="/assets/images/icons/chevron-down.svg" width="8" height="8" alt="Chevron Down"
                     class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-2 h-2 text-gray-400" />
              </div>

              <!-- Add athlete button -->
              <button type="button" (click)="onOpenAthleteModal()"
                      title="{{ 'MODAL.ATHLETE.ADD.TITLE' | translate }}"
                      class="shrink-0 flex items-center justify-center w-10.5 h-10.5 text-neutral-600
                             hover:text-green-600 transition-colors duration-200 cursor-pointer
                             border border-gray-300 rounded-lg">
                <span class="text-xl leading-none">+</span>
              </button>
            </div>
          </div>

          <!-- Second Row (Sports Dropdown & Result field) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-start">

            <!-- Sport Dropdown -->
            <div [class.col-span-2]="!formData().sportRawName">
              <label for="discipline-sport" class="block text-sm font-medium text-gray-700 mb-1">
                {{ 'MODAL.DISCIPLINES.SPORT' | translate }} <span class="text-red-500">*</span>
              </label>
              <div class="relative">
                <select [ngModel]="formData().sportRawName"
                        (ngModelChange)="onSportChange($event)"
                        name="sportRawName" id="discipline-sport" required
                        class="w-full appearance-none px-4 py-2 pr-8 border border-gray-300 rounded-lg cursor-pointer bg-white">
                  <option value="" disabled>{{ 'MODAL.DISCIPLINES.SPORT.PLACEHOLDER' | translate }}</option>
                  @for (sport of sports(); track sport.rawName) {
                    <option [value]="sport.rawName">{{ sport.name }}</option>
                  }
                </select>
                <img ngSrc="/assets/images/icons/chevron-down.svg" width="8" height="8" alt="Chevron Down"
                     class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-2 h-2 text-gray-400" />
              </div>
            </div>

            <!-- Result value (visible once a sport is selected) -->
            @if (formData().sportRawName) {
              <div>
                <label for="discipline-result" class="block text-sm font-medium text-gray-700 mb-1">
                  {{ resultLabelKey() | translate }} <span class="text-red-500">*</span>
                </label>
                <input [ngModel]="formData().resultValue" (ngModelChange)="onResultChange($event)"
                       [placeholder]="resultPlaceholder()" [class.border-red-500]="resultError()"
                       name="resultValue" id="discipline-result" type="text" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg placeholder-neutral-400 bg-white" />
                @if (resultError() || rankingError()) {
                  <p class="mt-1 text-sm text-red-600">{{ resultError() ? resultError() : (rankingError() | translate) }}</p>
                }
              </div>
            }

          </div>

          <!-- Medal Selection -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              {{ 'MODAL.DISCIPLINES.MEDAL' | translate }} <span class="text-red-500">*</span>
            </label>

            <div class="flex gap-3">
              <!-- Gold -->
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="medal" value="gold" [ngModel]="formData().medal" class="sr-only"
                       (ngModelChange)="miscService.updateField(formData, 'medal', $event)" />
                <div [class.ring-2]="formData().medal === 'gold'" [class.ring-yellow-400]="formData().medal === 'gold'"
                     class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg border border-gray-300
                            bg-white hover:bg-neutral-100 transition-all duration-200 text-sm font-medium">
                  <span>🥇</span>
                  <span>{{ 'MODAL.GOLD' | translate }}</span>
                </div>
              </label>

              <!-- Silver -->
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="medal" value="silver" [ngModel]="formData().medal" class="sr-only"
                       (ngModelChange)="miscService.updateField(formData, 'medal', $event)" />
                <div [class.ring-2]="formData().medal === 'silver'" [class.ring-gray-400]="formData().medal === 'silver'"
                     class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg border border-gray-300
                            bg-white hover:bg-neutral-100 transition-all duration-200 text-sm font-medium">
                  <span>🥈</span>
                  <span>{{ 'MODAL.SILVER' | translate }}</span>
                </div>
              </label>

              <!-- Bronze -->
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="medal" value="bronze" [ngModel]="formData().medal" class="sr-only"
                       (ngModelChange)="miscService.updateField(formData, 'medal', $event)" />
                <div [class.ring-2]="formData().medal === 'bronze'" [class.ring-orange-400]="formData().medal === 'bronze'"
                     class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg border border-gray-300
                            bg-white hover:bg-neutral-100 transition-all duration-200 text-sm font-medium">
                  <span>🥉</span>
                  <span>{{ 'MODAL.BRONZE' | translate }}</span>
                </div>
              </label>
            </div>
          </div>

          <!-- Action buttons -->
          <div class="border-t border-neutral-200 w-full">
            <div class="flex flex-col-reverse sm:flex-row gap-3 pt-4 justify-center">
              <button type="button" (click)="close()"
                      class="w-full sm:w-auto px-6 py-2 border border-gray-300 rounded-lg text-gray-700
                             hover:bg-gray-200 transition-colors cursor-pointer">
                {{ 'BUTTON.CANCEL' | translate }}
              </button>
              <button type="submit" [disabled]="!isFormValid()"
                      [class.opacity-50]="!isFormValid()"
                      [class.!cursor-not-allowed]="!isFormValid()"
                      class="w-full sm:w-auto px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600
                             disabled:bg-black transition-all font-semibold cursor-pointer">
                {{ 'MODAL.DISCIPLINES.ADD.TITLE' | translate }}
              </button>
            </div>
          </div>

        </form>
      </div>
    </div>
  </div>
}
