@if (isOpen()) {
  <div @backdropFade class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
       (click)="miscService.onBackdropClick($event, this.close.bind(this))">
    <div @modalSlideIn class="bg-neutral-100 rounded-lg shadow-xl max-w-lg max-h-[90vh] overflow-y-auto"
         (click)="$event.stopPropagation()">

      <!-- Header of Modal -->
      <div class="sticky top-0 bg-neutral-100 border-b border-neutral-200 px-6 py-4 flex items-center justify-between">
        <h3 class="text-4xl text-center lg:text-start tracking-wide font-normal text-gray-900">
          {{ isEditMode() ? ('MODAL.COUNTRY.EDIT.TITLE' | translate) : ('MODAL.COUNTRY.ADD.TITLE' | translate) }}
        </h3>
        <button (click)="close()" type="button" class="cursor-pointer hover:bg-neutral-200 p-2 rounded-full">
          <img ngSrc="/assets/images/icons/cross-close.svg" alt="Close Icon" height="16" width="16" class="w-4 h-4 opacity-50" />
        </button>
      </div>

      <div class="px-6 py-4">
        <form (ngSubmit)="onSubmit()" class="space-y-4">

          <!-- First Row (Code & Name) -->
          <div class="flex flex-row gap-x-6">
            <div>
              <label for="country-code" class="block text-sm font-medium text-gray-700 mb-1">
                {{ 'MODAL.COUNTRY.CODE' | translate }} <span class="text-red-500">*</span>
              </label>
              <input [(ngModel)]="formData().countryCode" name="countryCode" id="country-code"
                     type="text" maxlength="2" required placeholder="z.B. DE"
                     (ngModelChange)="miscService.updateField(this.formData, 'countryCode', $event)"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg placeholder-neutral-400">
            </div>

            <div class="w-full">
              <label for="country-name" class="block text-sm font-medium text-gray-700 mb-1">
                {{ 'MODAL.COUNTRY.NAME' | translate }} <span class="text-red-500">*</span>
              </label>
              <input [(ngModel)]="formData().countryName" name="countryName" id="country-name"
                     type="text" required [placeholder]="'MODAL.COUNTRY.NAME.PLACEHOLDER' | translate"
                     (ngModelChange)="miscService.updateField(this.formData, 'countryName', $event)"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg placeholder-neutral-400">
            </div>
          </div>

          <!-- Second Row (Medal Counts) -->
          <div class="grid grid-cols-3 gap-4">
            <div>
              <label for="gold" class="block text-sm font-medium text-gray-700 mb-1">🥇 {{'MODAL.GOLD' | translate}}</label>
              <input [ngModel]="formData().goldMedals"
                     (ngModelChange)="miscService.updateField(this.formData, 'goldMedals', +$event)"
                     name="gold" id="gold" type="number" min="0" required
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            <div>
              <label for="silver" class="block text-sm font-medium text-gray-700 mb-1">🥈 {{'MODAL.SILVER' | translate}}</label>
              <input [ngModel]="formData().silverMedals"
                     (ngModelChange)="miscService.updateField(this.formData, 'silverMedals', +$event)"
                     name="silver" id="silver" type="number" min="0" required
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            <div>
              <label for="bronze" class="block text-sm font-medium text-gray-700 mb-1">🥉 {{ 'MODAL.BRONZE' | translate}}</label>
              <input [ngModel]="formData().bronzeMedals"
                     (ngModelChange)="miscService.updateField(this.formData, 'bronzeMedals', +$event)"
                     name="bronze" id="bronze" type="number" min="0" required
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="border-t border-neutral-200 w-full">
            <div class="flex flex-col-reverse sm:flex-row gap-3 pt-4 justify-center">
              <button type="button" (click)="close()"
                      class="w-full sm:w-auto px-6 py-2 border border-gray-300 rounded-lg text-gray-700
                           hover:bg-gray-200 transition-colors cursor-pointer">
                {{'BUTTON.CANCEL' | translate}}
              </button>
              <button type="submit" [disabled]="!isFormValid()" [class.opacity-50]="!isFormValid()"
                      [class.!cursor-not-allowed]="!isFormValid()"
                      class="w-full sm:w-auto px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600
                             disabled:bg-black transition-all font-semibold cursor-pointer">
                {{ isEditMode() ? ('BUTTON.SAVE' | translate) : ('MODAL.COUNTRY.ADD.TITLE' | translate) }}
              </button>
            </div>
          </div>

        </form>
      </div>

    </div>
  </div>
}
