@if (isOpen()) {
  <div @backdropFade class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
       (click)="miscService.onBackdropClick($event, this.close.bind(this))">
    <div @modalSlideIn class="bg-neutral-100 rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto"
         (click)="$event.stopPropagation()">

      <!-- Header of Modal -->
      <div class="sticky top-0 bg-neutral-100 border-b border-neutral-200 px-6 py-4 flex items-center justify-between">
        <h3 class="text-4xl text-center lg:text-start tracking-wide font-normal text-gray-900">
          {{ 'MODAL.IMPORT.TITLE' | translate }}
        </h3>
        <button (click)="close()" type="button" class="cursor-pointer hover:bg-neutral-200 p-2 rounded-full">
          <img ngSrc="/assets/images/icons/cross-close.svg" alt="Close Icon" height="16" width="16" class="w-4 h-4 opacity-50" />
        </button>
      </div>

      <!-- Content -->
      <div class="px-6 py-4">
        <form (ngSubmit)="onSubmit()" class="space-y-4">

          <!-- File Upload Section -->
          <div>
            <label for="file-input" class="block text-sm font-medium text-gray-700 mb-2">
              {{ 'MODAL.IMPORT.FILE' | translate }} <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <input #fileInput type="file" accept=".csv,.xlsx,.xls"
                     (change)="onFileSelected($event)" hidden />
              <button type="button" (click)="fileInput.click()"
                      class="w-full px-4 py-6 border-2 border-dashed border-gray-300 rounded-lg
                             hover:border-purple-400 transition cursor-pointer text-center
                             hover:bg-purple-50/50">
                <div class="flex flex-col items-center gap-2">
                  @if (!selectedFile()) {
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    <span class="text-sm font-medium text-gray-700">{{ 'MODAL.IMPORT.FILE.PLACEHOLDER' | translate }}</span>
                  } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span class="text-sm font-medium text-green-600">{{ selectedFile()?.name }}</span>
                  }
                </div>
              </button>
            </div>
            <p class="mt-2 text-xs text-gray-500">
              {{ 'MODAL.IMPORT.FILE.HELP' | translate }}
            </p>
          </div>

          <!-- Form Actions -->
          <div class="flex gap-2 pt-4">
            <button type="submit" [disabled]="!selectedFile() || isLoading()"
                    class="flex-1 rounded bg-purple-500 px-4 py-2 text-sm font-semibold text-white
                           transition hover:bg-purple-600 disabled:opacity-50 disabled:cursor-not-allowed
                           shadow-sm flex items-center justify-center gap-2">
              @if (isLoading()) {
                <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
              }
              {{ 'MODAL.IMPORT.SUBMIT' | translate }}
            </button>
            <button type="button" (click)="close()"
                    class="rounded bg-gray-400 px-4 py-2 text-sm font-semibold text-white
                           transition hover:bg-gray-500 shadow-sm cursor-pointer">
              {{ 'BUTTON.CANCEL' | translate }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
}
