<div class="md:col-span-3">
  @if (label()) {
    <label [for]="id()" class="mb-1 block text-xs font-medium text-gray-500">
      {{ label() }}
    </label>
  }
  <div class="relative">
    <select [id]="id()" [ngModel]="value()" (ngModelChange)="value.set($event)"
            class="w-full appearance-none bg-transparent py-2 pr-8 pl-0 text-gray-900 focus:outline-none border-b
                   border-gray-300 cursor-pointer" [class.font-medium]="bold()">
      <ng-content></ng-content>
    </select>

    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 opacity-50">
      <img ngSrc="/assets/images/icons/chevron-down.svg" width="10" height="10" alt="Chevron Down" />
    </div>
  </div>
</div>
