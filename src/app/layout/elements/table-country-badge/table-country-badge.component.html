<div class="flex items-center" [ngClass]="this.smallVersion() ? 'gap-1' : 'gap-2'">
  @if (!this.isError) {
    <img [ngSrc]="flagUrl()" width="14" height="14" [alt]="name()" (error)="this.isError = true;"
         [ngClass]="this.smallVersion() ? 'w-3 h-2.5' : 'w-5 h-3.5 -mt-0.5'"
         class="object-cover rounded-sm shadow-sm shrink-0" />
  } @else {
    <div class="bg-gray-300 text-black items-center flex justify-center
                font-olympic-headline text-center pt-0.5 rounded-sm tracking-wide"
         [ngClass]="this.smallVersion() ? 'w-4.5 h-3 text-xs' : 'w-5 h-5 text-base'">?</div>
  }

  <span class="truncate text-gray-700" [ngClass]="this.smallVersion() ? 'text-xs' : ''">{{ name() }}</span>
</div>
