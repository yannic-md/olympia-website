<header class="font-olympic-sans w-full">

  <!-- Upper Part of the Sidebar (Buttons & Project Title) -->
  <div class="bg-[#f5f5f5] text-[#4a4a4a] text-[22px] py-5.5">
    <div class="w-full px-4 sm:px-10 md:px-16 flex justify-between items-center">

      <!-- Tournament Title -->
      <a routerLink="/" class="tracking-normal font-normal text-base sm:text-lg md:text-[22px] hover:brightness-50
                               transition-all duration-200">
        <span class="hidden sm:inline">Winterspiele 2026</span>
        <span class="sm:hidden">WS 2026</span>
      </a>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2 sm:gap-3 md:gap-5">
        <!-- Login Button - Hidden on small screens -->
        <button class="hidden sm:flex bg-[#cfe2f3] hover:bg-[#bed7ee] text-zinc-950 px-2 md:px-4.5 py-0 rounded-full
                       items-center gap-0 transition-all cursor-pointer group duration-200 hover:drop-shadow-md">
          <img ngSrc="/assets/images/icons/user-alt.svg" width="40" height="40" alt="User Icon" class="md:w-12.5 md:h-12.5" />
          <span class="font-medium text-lg md:text-[21px]">Anmelden</span>
        </button>

        <!-- Login Icon for mobile -->
        <button class="sm:hidden bg-[#cfe2f3] hover:bg-[#bed7ee] text-zinc-950 p-1 rounded-full transition-all
                       cursor-pointer duration-200">
          <img ngSrc="/assets/images/icons/user-alt.svg" width="32" height="32" alt="User Icon" />
        </button>

        <!-- Language Switcher -->
        <div class="relative language-menu-container">
          <button (click)="toggleLanguageMenu()"
                  class="bg-white hover:bg-gray-50 text-neutral-600 px-3 sm:px-5 md:px-7 py-2 sm:py-3 md:py-4
                         rounded-full flex items-center justify-between gap-2 sm:gap-3 md:gap-5 cursor-pointer
                         hover:drop-shadow-md transition-all duration-200">
            <span class="font-normal text-sm sm:text-base md:text-xl leading-[0.9px]">
              {{ currentLanguage === 'Deutsch' ? 'Deutsch' : 'English' }}</span>
            <img ngSrc="/assets/images/icons/chevron-down.svg" width="12" height="12" alt="Chevron Down Icon"
                 [class.rotate-180]="isLanguageMenuOpen" class="mb-0.5 transition-transform duration-200 md:w-3.5 md:h-3.5" />
          </button>

          @if (isLanguageMenuOpen) {
            <div class="absolute top-full mt-2 right-0 bg-white rounded-lg shadow-lg border border-neutral-200
                        overflow-hidden min-w-28 sm:min-w-37.5 z-50 animate-fadeIn">
              <button (click)="changeLanguage('Deutsch')"
                      class="w-full px-4 sm:px-6 py-2 sm:py-3 text-left text-neutral-600 hover:bg-gray-50
                             transition-colors duration-200 font-normal text-base sm:text-xl cursor-pointer"
                      [class.bg-gray-100]="currentLanguage === 'Deutsch'">Deutsch</button>
              <button (click)="changeLanguage('English')"
                      class="w-full px-4 sm:px-6 py-2 sm:py-3 text-left text-neutral-600 hover:bg-gray-50
                             transition-colors duration-200 font-normal text-base sm:text-xl cursor-pointer"
                      [class.bg-gray-100]="currentLanguage === 'English'">English</button>
            </div>
          }
        </div>
      </div>
    </div>
  </div>

  <!-- Navigation Part -->
  <div class="bg-white py-4 border-b border-b-neutral-200 relative z-10">
    <div class="w-full px-4 sm:px-10 md:px-16 flex items-center justify-between">

      <!-- Logo -->
      <a routerLink="/" class="shrink-0 block pt-1">
        <img ngSrc="/assets/images/logo_color.svg" width="100" height="46" alt="Logo Icon" class="md:w-32.5 md:h-15" />
      </a>

      <!-- Desktop Navigation -->
      <nav class="hidden lg:flex gap-12 xl:gap-24 absolute left-1/2 -translate-x-1/2 text-2xl xl:text-3xl
                  text-black tracking-tight">
        @for (item of routes; track item.path) {
          @if (item.path != 'login') {
            <a [routerLink]="item.path?.replaceAll('*', '')"
               class="relative after:content-[''] after:absolute after:-bottom-7.75 after:left-0
                       after:w-0 after:h-0.75 after:bg-black after:transition-all after:duration-200
                       hover:after:w-full">{{ getRouteName(item.path) }}</a>
          }
        }
      </nav>

      <!-- Mobile Menu Button -->
      <button (click)="toggleMobileMenu()" class="lg:hidden p-2 text-black mobile-menu-container">
        <div class="relative w-6 h-6">
          <img ngSrc="/assets/images/icons/hamburger-menu.svg" alt="Hamburger Icon" height="24" width="24"
               class="w-6 h-6 absolute inset-0 transition-all duration-300"
               [class.opacity-0]="isMobileMenuOpen" [class.rotate-90]="isMobileMenuOpen" />
          <img ngSrc="/assets/images/icons/cross-close.svg" alt="Close Icon" height="24" width="24"
               class="w-4 h-4 absolute inset-0 transition-all duration-300 left-1! top-1!"
               [class.opacity-0]="!isMobileMenuOpen" [class.-rotate-90]="!isMobileMenuOpen" />
        </div>
      </button>

    </div>

    <!-- Mobile Navigation Menu -->
    @if (isMobileMenuOpen) {
      <div class="lg:hidden absolute top-full left-0 w-full bg-white border-t border-neutral-200 shadow-lg z-50
                  animate-fadeIn mobile-menu-container">
        <nav class="flex flex-col py-4 px-4 sm:px-10">
          @for (item of routes; track item.path) {
            @if (item.path != 'login') {
              <a [routerLink]="item.path?.replaceAll('*', '')" (click)="isMobileMenuOpen = false"
                 class="py-3 text-xl text-black border-b border-neutral-100 last:border-b-0 hover:bg-gray-50
                        transition-colors duration-200">{{ getRouteName(item.path) }}</a>
            }
          }
        </nav>
      </div>
    }
  </div>
</header>
