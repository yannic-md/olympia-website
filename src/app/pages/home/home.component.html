<!-- Header & Welcome Section -->
<app-header />
<app-breadcrumb />

<!-- Real Page Content -->
@for (cat of categories; track cat.title) {

  <section class="w-full md:max-w-3/4 bg-neutral-100 mx-auto mb-8 md:mb-12 p-4 md:p-10 md:px-23 md:pb-6
                  border-neutral-200 border-t">

    <!-- Header (Title and Button) -->
    <div class="flex flex-col lg:flex-row lg:justify-between gap-4 mb-8 md:mb-12">
      <h2 class="text-xl md:text-2xl lg:text-3xl text-center lg:text-start leading-tight font-olympic-sans font-normal text-gray-900">
        {{ cat.title }}
      </h2>

      <div class="flex items-center gap-4 md:gap-6 justify-center lg:justify-end">
        <a routerLink="/detailed" class="w-full md:w-auto">
          <button class="w-full md:w-auto bg-[rgb(215,195,120)] hover:bg-[#cfbc7e] text-white text-sm
                         md:text-base font-medium py-2 md:py-1.5 px-4 rounded shadow-sm transition-colors cursor-pointer">
            Gesamtergebnisse anzeigen
          </button>
        </a>
      </div>
    </div>

    <!-- Leaderboard (First Top 3) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-6">
      @for (winner of cat.winners; track winner.type) {
        <div class="bg-white p-4 md:p-6 rounded shadow-sm flex flex-col items-center col-span-2 xl:col-span-1">

          <div class="w-full flex items-center gap-2 mb-6 md:mb-8">
            <span class="w-3 h-3 rounded-full {{ getWinnerColor(winner.type) }}"></span>
            <span class="text-gray-600 text-lg md:text-xl font-normal">{{ winner.type }}</span>
          </div>

          <div class="w-43 h-43 rounded-full overflow-hidden border border-gray-100 shadow-sm mb-8 shrink-0">
            <img [ngSrc]="'https://flagcdn.com/' + winner.flagCode + '.svg'" width="172" height="172"
                 [alt]="winner.countryName" class="w-full h-full object-cover" />
          </div>

          <span class="text-gray-900 text-xl font-normal tracking-tight">
            {{ winner.countryName }}
          </span>
        </div>
      }
    </div>

  </section>
}

<!-- Footer (At the end of the page) -->
<app-footer />
