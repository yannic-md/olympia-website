services:
  angular:
    image: node:20-alpine
    container_name: olympia-web
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "4200:4200"
    command: >
      sh -c "
      npm install &&
      npx ng serve --host 0.0.0.0 --poll=2000
      "
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
